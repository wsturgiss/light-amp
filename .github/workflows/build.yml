name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with light-sdk submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The light-keyboard dependency comes from GitHub Packages, which needs
      # any authenticated token to read. The workflow token usually suffices;
      # if it ever stops resolving, add a classic PAT with read:packages as
      # the GH_PACKAGES_TOKEN repo secret.
      - name: Build and test
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :tool:assembleDebug :tool:test :sdk:client:test
